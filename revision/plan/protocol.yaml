data_identity:
  PEMS04: {T: 16992, N: 307, steps_per_day: 288,
           boundaries: {train_end: 10195, select_end: 11894, calib_end: 13593, test_end: 16992}}
  PEMS03: {T: 26208, N: 358, steps_per_day: 288,
           boundaries: {train_end: 15724, select_end: 18345, calib_end: 20966, test_end: 26208}}
  PEMS08: {T: 17856, N: 170, steps_per_day: 288,
           boundaries: {train_end: 10713, select_end: 12499, calib_end: 14284, test_end: 17856},
           status: TRAIN_SELECT_OPENED_TEST_SEALED,
           opened_utc: '2026-09-21',
           evidence: 'checkpoints/PEMS08_e7_4split_seed42/pilot_meta.json :: boundaries',
           exposure: 'RT-STN 线曾用；UC 线零使用；不得称全新未见集',
           test_unseal_requires: 'PLAN_FROZEN §7 冻结清单全部签署后方可由 export_preds.py 打开'}

splits:
  basis: original_timeline
  window_origin_rule: 'g in [start, end - 23)   # purge = IL + OL - 1 = 23 anchors'
  roles:
    train: '点预测训练 + 全部 train-only 统计（tau、severity m/d/q99、归一化 mean/std）'
    selection: 'checkpoint 选择 + 后处理风险模型与 a_(n,h) 的拟合集'
    calibration: '仅用于 conformal 分位数估计'
    test: '仅评价'
  all_targets_inside_role: true
  allow_preceding_observed_history: true
  train_only_statistics: true
  test_side_fitting: forbidden          # 含尺度、分箱、模型选择、缩放因子
  calibration_for_risk_model_fit: false
  temporal_independence_claim: false

masks:
  target_valid_rule: 'true > 0'
  path_eligible_rule: 'V_{i,n} = 1  <=>  该 (node,window) 的 12 个目标全部 valid'
  both_metrics_same_population: true    # 逐点与路径覆盖均在 V=1 群体上计算（修正 v2 缺陷）
  observed_path_eligible_rate: {PEMS04: 0.9780, PEMS03: 0.9730}
  all_zero_flow_is_missing_claim: false # 无独立质量标记前不得断言
  missing_severity_group_required: true

metrics:
  primary: [path_simultaneous_coverage, mean_width, group_path_coverage]
  auxiliary: [pointwise_coverage_same_population, IS_0.10, U_obs, WCE_event, GCD_event]
  IS_status: auxiliary_kept_not_primary   # v3.0 决定；不采用"IS 只奖励窄"这一已被撤回的解释
  coverage_target:
    pointwise_nominal: 0.90
    path_simultaneous_nominal: 0.90
  u_obs_caveat: '前瞻群体含幅度分箱时对量级类方法有结构性偏好；必须同时报告不含幅度分箱的互补分组'
  event_group_guarantee: false          # 事后组不要求达到 90%

groups:
  event_posthoc: [Normal, TypeA, TypeB, TypeC]     # 原稿定义，边界差分不分配给任一侧
  prospective_primary: 'input_transition(bool) x predicted_magnitude_tertile(3)'
  prospective_complementary: 'input_transition(bool) x historical_flow_tertile(3)'   # 强制并列
  prospective_boundaries_fit_on: selection
  low_support_windows: 20
  low_support_calendar_days: 5

risk_learner:
  family: HistGradientBoostingRegressor
  loss: quantile
  quantile: 0.90
  learning_rate: 0.05
  max_iter: 200
  max_leaf_nodes: 15
  min_samples_leaf: 100
  early_stopping: false
  fit_on: selection
  base_and_augmented_same_budget: true
  g_positive_floor: '0.01 * median(g_cal)'
  scale_a_nh: {fit_on: selection, statistic: 'mean |residual| per (h,n)',
               positive_floor: 'EPS_REL=1e-3 * node median', sparse_fallback: node_median}
  Z0: [pred_mag, pred_std, pred_trend, argmax_pos, flow_in, log_node_scale, sin_tod, cos_tod, dow]
  Z1: 'Z0 + [S0 = r_in_max]'
  forbidden_features: [future_truth, TypeB_label, TypeC_label, immature_residual, test_side_statistics]
  local_package_version: {sklearn: 1.7.2, numpy: 2.2.6, torch: 2.9.1+cu126}

inference:
  bootstrap_kind: paired_stationary_time_blocks
  resample_unit: forecast_window        # 携带其全部 node 与 horizon
  expected_block_origins: 288
  sensitivity_block_origins: [144, 576]
  replicates: 2000
  shared_indices_across_methods_and_seeds: true
  metric_order: compute_per_config_then_average_over_seeds
  seed_std_ddof: 1
  counts_must_be_exact_integers: true
  float_aggregation_dtype: float64

tolerance_policy:                        # 仅用于复算对账，不用于命中计数
  ratios_and_counts_absolute: 1.0e-4
  raw_scale_fields_relative: 1.0e-6      # width / IS；float32 对 12M 元素求和实测漂移 1.5e-4
  gate: 'worst |diff| / tolerance < 1  => CACHE TRUSTED'
  cross_batch_reproduction: 1.0e-3       # 重算若使用不同 inference batch size，容差放宽至此
                                         # 依据：E2 实测 AMP 下 bs=32 使 max|Δpred| ≈ 0.22-0.24

point_forecast_inference:                # E2 新增（与上方 bootstrap 的 inference 段区分）
  batch_size_frozen: 64
  determinism_scope: 'same checkpoint + same batch size + same GPU => bitwise identical'
  measured_sensitivity: 'bs=64 时 64/128/3376 窗重跑与缓存逐位相同(Δ=0)；bs=32 或 32 窗不满批 → max|Δpred| ≈ 0.22-0.24（相对 ~1e-3），比 float32/float64 求和效应(1.5e-4)大约一个量级'
  amp_autocast: true
  evidence: 'audit/leakage_checks.json :: S4/inference_determinism_same_batching, S4/inference_batch_size_sensitivity'

documented_deviations:                   # 已实测、已记录、暂不改实现的行为（不得静默）
  - id: DEV-E2-1
    item: missing-severity 分组
    frozen_requirement: 'protocol 要求无有效历史相邻对的窗口单独成 missing-severity 组'
    actual_behavior: 'r^in = 0，落入最低 severity 箱，与真实低严重度窗口混合'
    evidence: 'audit/leakage_checks.json :: S5/no_valid_adjacent_pair'
    action: 'E4 稿件中显式说明，或改为独立组后重算'
  - id: DEV-E2-2
    item: S0 进入风险模型设计矩阵时的精度
    frozen_requirement: 'severity 以 float64 参与 Mondrian 条件化'
    actual_behavior: 'Z1 设计矩阵以 float32 存储，S0 列相对偏差 ~1e-7'
    evidence: 'audit/leakage_checks.json :: S6/matched_budget_g0_g1'
    action: '远低于容差政策，保留并记录，避免日后误判为口径不一致'
  - id: DEV-1
    item: legacy backbone 使用 trackA 变体权重
    frozen_requirement: 'uncalib_v1 E8 冻结 PEMS04_*.pt 主版'
    actual_behavior: 'UC-G1/legacy 四段实际用 PEMS04_*_trackA.pt'
    action: '沿用 uncalib_v1/PLAN.md 既有记录；legacy 结果仅作探索性证据'
  - id: DEV-E7-1
    item: PEMS04 STID 既有 checkpoint 的协议合规性
    frozen_requirement: 'PLAN_FROZEN §7：能证明四段协议才复用；否则从确认性主表移除，不为凑矩阵自动重训'
    actual_behavior: '六项实测不合规（窗口编号切分丢失 46 窗、test 起点 13547≠13593、无 23-anchor purge、
      calib 目标与 test 输入重叠 22 点、全局单标量归一化 flow mean=207.4577/std=156.0088、
      norm 空间 !=0 掩码实测零排除）'
    evidence: 'audit/stid_compliance.md'
    action: 'PEMS04 STID 降级为探索性证据，不进入确认性主表；不重训 PEMS04 STID；
      第二骨干需求改由 PEMS08 STID ×3 seed 在 e7_train_stid.py 冻结协议下满足'
  - id: DEV-E7-2
    item: 复用 legacy R3 STAEformer checkpoint 与新脚本混用
    frozen_requirement: '确认层的跨数据集/跨 seed 比较不得混入协议差异这一混杂因素'
    actual_behavior: 'PEMS04 ×3 seed 与 PEMS03 s42 由 uncalib_v1/SCRIPTS/train_r3.py 产出，
      其余 8 次由 revision_v1/scripts/e7_train.py 产出'
    evidence: 'audit/e7_script_equivalence.{json,md} :: summary.verdict = EQUIVALENT
      （训练语义 20/20 MATCH、STAEformer 构造参数 16/16 一致、四段比例扫描一致、
      desc.json 与 legacy 硬编码 N 一致；C11/C12/C14 三项以显式登记的命名与括号容忍判定）'
    action: '允许混用并进入同一确认层；两脚本的 sha256 均已记录，可复核'
  - id: DEV-E7-4
    item: r2a_path_baselines.json 的 contrasts 与当前脚本 rng 流不一致
    frozen_requirement: '确认层聚合器必须与探索层同定义；对账门逐位通过'
    actual_behavior: 'PEMS04 s42 上 A.metrics / B.metrics / B.contrasts 逐位为 0 偏差，
      仅 A.contrasts（bootstrap CI）偏 ≤1.33e-3 相对 → 存储产物的 contrasts 出自旧版 rng 流；
      点估计与闸门判定（7/7 方法 G1/G2 通过集合）不受影响'
    evidence: 'audit/r2a_contrast_provenance.md；results/phase2_E7/{_validation.json,
      _gate_agreement_PEMS04s42.json}'
    action: '对账门分档（确定性量与 B.contrasts 逐位；A.contrasts 容差 5e-3 并记录 top-5）；
      修订稿 CI 一律引用冻结脚本当前产物；存储 r2a json 不删不覆盖，仅 contrasts 标记为旧流追溯用'
  - id: DEV-E7-3
    item: STID 在冻结协议下的输入归一化口径
    frozen_requirement: '归一化 per-node、train-only'
    actual_behavior: 'e7_train_stid.py 对输入 ch0（flow）做 per-node 归一化，ch1/ch2 保持原值，
      输出按同一 per-node 统计量逆变换后在 raw 空间计 masked MAE；
      legacy train_stid_fast.py 的输入是全局单标量归一化窗口（不是 raw）'
    evidence: 'scripts/e7_train_stid.py :: batch() 与 docstring 第 3 条；
      uncalib_v1/SCRIPTS/train_stid_fast.py:33（scaler_mean/std 单标量）'
    action: '与 e7_train.py（STAEformer）完全对齐，两骨干共用同一归一化口径；
      曾一度误写为"输入保持 raw 以匹配 legacy"，经核对 legacy 实为归一化输入后已更正'

gates:
  G1_non_inferiority: {stat: 'path_cov(candidate) - path_cov(reference)',
                       one_sided_95_lower_min: -0.01}
  G2_efficiency:      {stat: 'mean_width(candidate) / mean_width(reference)',
                       one_sided_95_upper_max: 0.95,
                       quantile: 'one-sided 95% UPPER of the paired-bootstrap ratio (p95), NOT the mean'}
  G3_achieved_coverage: {absolute_floor: 0.89, binding: false,
                         reason: 'PEMS03 上连 P00 也只达 0.8803，绝对闸门恒 FAIL；改为描述性报告',
                         required_report: 'reference 达成覆盖 + 数据集漂移量 (P00 达成覆盖 - 0.90)'}
  pass_rule: 'G1 AND G2'
  population: '主表的 path_cov / pointwise_same_pop / mean_width / IS 一律在 V=1 完整路径群体上计算；
    全有效元素口径仅作辅助列保留（作者校审 2026-09-21：旧实现两轴群体不同）'
  output_requirement: 'G1、G2、实际覆盖率分开输出；代码不得把 0.89 覆盖下限并入 gate_pass 的合取条件'
  note: '-0.01 / 0.95 / 0.89 为本项目实用决策门槛，非期刊标准，非覆盖保证'

claim_routing:
  A_method_claim: {condition: 'P07 vs P06 通过 G1&G2 于 >=2 数据集', status: REJECTED_BY_MEASUREMENT,
                   evidence: 'width ratio 0.9869/0.9835/0.9860/0.9892'}
  B_cost_heterogeneity: {condition: '成本阶梯+通道分工+漂移惩罚在 >=2 数据集 x >=2 seed 一致',
                         status: LOCKED, evidence: '4 config 一致，见 PLAN_FROZEN §3.2-3.4'}
  C_insufficient: {status: NOT_APPLICABLE}
  D_repair_incomplete: {status: CLOSED_BY_E1,
                        closed_date: '2026-09-21',
                        reason: '附录表 7/8/9 曾在 test 段自校准；E1 已在独立 calib 段重算',
                        evidence: 'results/phase1_R1/e1_appendix_recompute.json；
                          audit/reconciliation.md（F01 关闭记录，test_as_calib 偏差 0.00000）',
                        residual: '表 7/9 结论存活；表 8 需改写为 median+MAD 居中而非最优'}
  no_significance_does_not_imply_equivalence: true
  allow_valid_negative_result: true

