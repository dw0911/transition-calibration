  verdict: '方向保留（成本与异质性实证路线）；实验规模冻结；暂缓投稿；结论允许随新证据改变'
  corrections:
    - id: C-A
      item: '普遍自适应—漂移惩罚撤回'
      rule: '稿件不得以普遍机制或副标题贡献呈现；开发集下降曲线与 PeMS08 上升曲线必须同时完整呈现；
             结论改为"条件化对覆盖的影响环境依赖"；漂移仅作解释线索'
      evidence: 'author_finding_checks.json A1（PEMS08 12/12 负斜率；PEMS04 6/6 正；PEMS03 g1 正、g0 混合）'
    - id: C-B
      item: '"实现 90% 同时覆盖的价格"必须带实际覆盖率'
      rule: '主表统一报告：固定名义水平下各方法自然工作点的实际覆盖率 + 宽度 + 成本比；
             不在已查看的 test 上重调尺度'
      evidence: 'cross_config_C3.json（PEMS03 global 0.880 / g0 0.870）'
    - id: C-C
      item: '"Bonferroni 被严格支配"撤回'
      rule: '改为覆盖—宽度交换；严格支配需"覆盖不低且宽度不大"，当前自然工作点对比未建立'
      evidence: 'author_finding_checks.json A2 / phase2_E7 contrasts'
    - id: C-D
      item: 'severity 结论收窄'
      rule: '"未达 5% 效率门槛，但在匹配风险模型中产生稳定事件组再分配"；
             element 级再分配与 g1-vs-g0 增量分别命名分别引用；禁用"两通道各主管一种风险"'
      evidence: 'cross_config_C3.json channel（element 级）+ r2b（匹配模型）'
    - id: C-E
      item: 'C4 概率口径'
      rule: '同报 P(S)、P(A∩S)、P(A|S)；删除 FCR≤α 预期；新增真峰值残差基线
             s = max_h Y − max_h Ŷ（现有 max_h(Y−Ŷ) 改名 stepwise_upper 保留）；
             峰值越带率改在统一 test 群体上直接统计真实峰值是否超过预测上界'
      evidence: 'author_finding_checks.json A3'
    - id: C-F
      item: '验收判据与协议同步'
      rule: 'G2 用比率分布的 p95（单侧 95% 上界），G1 用 Δcov 的 p5；实际覆盖率单独描述；
             删除代码中"两方法覆盖≥0.89 且均值比≤0.95"的自设合取'
      evidence: 'protocol.yaml gates + r2a/e7_metrics 代码差异记录（author_finding_checks.json A4）'

