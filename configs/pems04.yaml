# PEMS04 configuration (used by the paper reproduction scripts)
dataset: PEMS04

data:
  num_nodes: 307
  input_dim: 3            # flow / occupancy / speed
  target_dim: 0           # evaluate flow only
  his_steps: 12
  pred_steps: 12
  train_ratio: 0.6
  val_ratio: 0.2

evaluation:
  alpha: 0.10
  nominal: 0.90
  mondrian_K: 5
  valid_target: true>0 & finite

bootstrap:
  type: stationary (Politis-Romano)
  block_lengths: [144, 288, 576]   # mean block 0.5 / 1 / 2 days
  n_boot: 1000
  seeds: [42, 123, 456]

seeds: [42, 123, 456]
